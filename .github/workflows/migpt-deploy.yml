name: MiGPT deploy

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/migpt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/migpt/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cp config.example.ts config.ts
      - run: cargo test --manifest-path Cargo.toml
      - run: npx tsc --noEmit
      - run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/migpt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/migpt/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cp config.example.ts config.ts
      - run: pnpm build
      - name: Pack release
        run: |
          tar czf "/tmp/migpt-${GITHUB_REF_NAME}.tar.gz" \
            --exclude=config.ts \
            --exclude=speaker.local.env \
            --exclude=target \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: migpt-release
          path: /tmp/migpt-*.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: migpt-release
          path: /tmp
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOUBAO_APP_ID: ${{ secrets.DOUBAO_APP_ID }}
          DOUBAO_ACCESS_KEY: ${{ secrets.DOUBAO_ACCESS_KEY }}
          OPEN_XIAOAI_TOKEN: ${{ secrets.OPEN_XIAOAI_TOKEN }}
        run: |
          scp "/tmp/migpt-${TAG}.tar.gz" "${VPS_USER}@${VPS_HOST}:/tmp/migpt-${TAG}.tar.gz"
          cat > /tmp/migpt-deploy.env <<EOF
          TAG=${TAG}
          DOUBAO_APP_ID=${DOUBAO_APP_ID}
          DOUBAO_ACCESS_KEY=${DOUBAO_ACCESS_KEY}
          OPEN_XIAOAI_TOKEN=${OPEN_XIAOAI_TOKEN}
          EOF
          scp /tmp/migpt-deploy.env "${VPS_USER}@${VPS_HOST}:/tmp/migpt-deploy.env"
          scp examples/migpt/scripts/deploy-remote.sh "${VPS_USER}@${VPS_HOST}:/tmp/migpt-deploy.sh"
          ssh "${VPS_USER}@${VPS_HOST}" "chmod +x /tmp/migpt-deploy.sh && bash /tmp/migpt-deploy.sh /tmp/migpt-deploy.env"
          rm -f /tmp/migpt-deploy.env
      - name: WebSocket smoke test
        working-directory: examples/migpt
        run: |
          pnpm install --frozen-lockfile
          for i in 1 2 3 4 5 6; do
            if SMOKE_WS_URL="ws://${{ secrets.VPS_HOST }}:4399?token=${{ secrets.OPEN_XIAOAI_TOKEN }}" \
              pnpm exec tsx scripts/deploy-smoke.ts; then
              exit 0
            fi
            echo "smoke retry $i..."
            sleep 5
          done
          exit 1
      - name: Rollback on smoke failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" bash -s << 'REMOTE'
          set -euo pipefail
          PREVIOUS="$(cat /tmp/migpt-previous-release 2>/dev/null || true)"
          if [[ -n "${PREVIOUS}" && -d "${PREVIOUS}" ]]; then
            ln -sfn "${PREVIOUS}" /opt/migpt/current
            cd /opt/migpt/current
            pm2 reload ecosystem.config.cjs --update-env || true
            echo "Rolled back to ${PREVIOUS}"
          fi
          REMOTE

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: migpt-release
          path: /tmp
      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/migpt-*.tar.gz
