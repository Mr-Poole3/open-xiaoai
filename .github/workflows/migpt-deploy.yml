name: MiGPT deploy

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/migpt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/migpt/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cp config.example.ts config.ts
      - run: cargo test --manifest-path Cargo.toml
      - run: npx tsc --noEmit
      - run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/migpt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/migpt/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cp config.example.ts config.ts
      - run: pnpm build
      - name: Pack release
        run: |
          tar czf "/tmp/migpt-${GITHUB_REF_NAME}.tar.gz" \
            --exclude=config.ts \
            --exclude=speaker.local.env \
            --exclude=target \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: migpt-release
          path: /tmp/migpt-*.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: migpt-release
          path: /tmp
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup SSH
        run: |
          install -m 600 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOUBAO_APP_ID: ${{ secrets.DOUBAO_APP_ID }}
          DOUBAO_ACCESS_KEY: ${{ secrets.DOUBAO_ACCESS_KEY }}
          OPEN_XIAOAI_TOKEN: ${{ secrets.OPEN_XIAOAI_TOKEN }}
        run: |
          scp "/tmp/migpt-${TAG}.tar.gz" "${VPS_USER}@${VPS_HOST}:/tmp/migpt-${TAG}.tar.gz"
          ssh "${VPS_USER}@${VPS_HOST}" env \
            "TAG=${TAG}" \
            "DOUBAO_APP_ID=${DOUBAO_APP_ID}" \
            "DOUBAO_ACCESS_KEY=${DOUBAO_ACCESS_KEY}" \
            "OPEN_XIAOAI_TOKEN=${OPEN_XIAOAI_TOKEN}" \
            bash -s << 'REMOTE'
          set -euo pipefail
          MIGPT_ROOT="/opt/migpt"
          RELEASE="${MIGPT_ROOT}/releases/${TAG}"
          mkdir -p "${MIGPT_ROOT}/releases"
          rm -rf "${RELEASE}"
          mkdir -p "${RELEASE}"
          tar xzf "/tmp/migpt-${TAG}.tar.gz" -C "${RELEASE}"
          rm -f "/tmp/migpt-${TAG}.tar.gz"

          PREVIOUS=""
          if [[ -L "${MIGPT_ROOT}/current" ]]; then
            PREVIOUS="$(readlink -f "${MIGPT_ROOT}/current" || true)"
          fi
          echo "${PREVIOUS}" > /tmp/migpt-previous-release

          cd "${RELEASE}"
          pnpm install --frozen-lockfile
          node scripts/render-deploy-config.mjs
          printf 'OPEN_XIAOAI_TOKEN=%s\n' "${OPEN_XIAOAI_TOKEN}" > .env

          ln -sfn "${RELEASE}" "${MIGPT_ROOT}/current"
          cd "${MIGPT_ROOT}/current"

          if pm2 describe migpt >/dev/null 2>&1; then
            pm2 reload ecosystem.config.cjs --update-env
          else
            pm2 start ecosystem.config.cjs
            pm2 save
          fi

          cd "${MIGPT_ROOT}/releases"
          ls -1dt v* 2>/dev/null | tail -n +4 | xargs -r rm -rf
          REMOTE
      - name: WebSocket smoke test
        working-directory: examples/migpt
        run: |
          pnpm install --frozen-lockfile
          SMOKE_WS_URL="ws://${{ secrets.VPS_HOST }}:4399?token=${{ secrets.OPEN_XIAOAI_TOKEN }}" \
            pnpm exec tsx scripts/deploy-smoke.ts
      - name: Rollback on smoke failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" bash -s << 'REMOTE'
          set -euo pipefail
          PREVIOUS="$(cat /tmp/migpt-previous-release 2>/dev/null || true)"
          if [[ -n "${PREVIOUS}" && -d "${PREVIOUS}" ]]; then
            ln -sfn "${PREVIOUS}" /opt/migpt/current
            cd /opt/migpt/current
            pm2 reload ecosystem.config.cjs --update-env || true
            echo "Rolled back to ${PREVIOUS}"
          fi
          REMOTE

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: migpt-release
          path: /tmp
      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/migpt-*.tar.gz
